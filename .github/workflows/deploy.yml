name: deploy

# The AWS deployment was taken down on 2026-10-03, so this only runs when started by hand.
# To redeploy, recreate the AWS resources (README, "Deploy to AWS") and restore these triggers:
#   workflow_run (ci completed on main) and repository_dispatch (model-promoted).
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request an OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build the command to run on the instance
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          K="k3s kubectl -n oulad"
          if [ "$EVENT" = "repository_dispatch" ]; then
            # A new champion was exported to S3: restart pods so they load it.
            CMD="$K rollout restart deployment/oulad-api && $K rollout status deployment/oulad-api --timeout=180s"
          else
            # New code: point the API and the pipeline at the image built for this commit.
            CMD="$K set image deployment/oulad-api api=ghcr.io/$OWNER/oulad-api:$SHA"
            CMD="$CMD && $K set image cronjob/oulad-pipeline pipeline=ghcr.io/$OWNER/oulad-pipeline:$SHA"
            CMD="$CMD && $K set image deployment/oulad-dashboard dashboard=ghcr.io/$OWNER/oulad-dashboard:$SHA"
            CMD="$CMD && $K set image deployment/oulad-mlflow mlflow=ghcr.io/$OWNER/oulad-mlflow:$SHA"
            CMD="$CMD && $K rollout status deployment/oulad-api --timeout=180s"
          fi
          jq -n --arg c "$CMD" '{commands: [$c]}' > params.json
          cat params.json

      - name: Run it through SSM and wait for the result
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://params.json \
            --query Command.CommandId --output text)
          sleep 3
          for i in $(seq 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}'
          test "$STATUS" = "Success"
