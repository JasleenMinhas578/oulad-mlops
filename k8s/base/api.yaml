apiVersion: apps/v1
kind: Deployment
metadata:
  name: oulad-api
  labels:
    app: oulad-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below 2 ready pods during an update
      maxSurge: 1
  selector:
    matchLabels:
      app: oulad-api
  template:
    metadata:
      labels:
        app: oulad-api
    spec:
      containers:
        - name: api
          image: oulad-api        # replaced per environment by Kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oulad-config
          readinessProbe:         # "send me traffic" only once the model is loaded
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:          # "restart me" if I stop answering
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oulad-api
spec:
  type: NodePort
  selector:
    app: oulad-api
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
