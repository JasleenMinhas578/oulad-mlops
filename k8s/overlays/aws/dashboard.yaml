apiVersion: apps/v1
kind: Deployment
metadata:
  name: oulad-dashboard
  labels:
    app: oulad-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oulad-dashboard
  template:
    metadata:
      labels:
        app: oulad-dashboard
    spec:
      containers:
        - name: dashboard
          image: oulad-dashboard
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: oulad-config
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oulad-dashboard
spec:
  type: NodePort
  selector:
    app: oulad-dashboard
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
