apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-db
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # k3s ships this provisioner
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oulad-mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate                    # SQLite: never two servers on one file
  selector:
    matchLabels:
      app: oulad-mlflow
  template:
    metadata:
      labels:
        app: oulad-mlflow
    spec:
      containers:
        - name: mlflow
          image: oulad-mlflow
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: mlflow-config
          volumeMounts:
            - name: db
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: mlflow-db
---
apiVersion: v1
kind: Service
metadata:
  name: oulad-mlflow
spec:
  type: NodePort                      # reachable only through an SSM tunnel (port not in the SG)
  selector:
    app: oulad-mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
